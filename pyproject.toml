[project]
name = "mcp-libre"
version = "2.1.0"
description = "LibreOffice MCP server - edits documents open in a running LibreOffice through a local UNO pipe"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "LibreOffice MCP Server Project"},
]
keywords = ["mcp", "libreoffice", "document", "processing", "ai", "assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.3,<3",
    "pydantic>=2.0.0",
]

[project.scripts]
mcp-libre = "src.libremcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
